services:
  pocket-calendar:
    image: ghcr.io/abjelosevic88/pocket-homelab-calendar:latest
    container_name: pocket-calendar
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-UTC}
      BASE_URL: ${BASE_URL:-}
      # Set both to skip the first-run setup screen and create the admin directly:
      # ADMIN_EMAIL: ${ADMIN_EMAIL}
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # AUTH_MODE: proxy                # trust Remote-User from Authelia / Authentik / Tinyauth
      # NOTIFY_URL: http://apprise:8000/notify/calendar   # reminders, invitations, the morning agenda
      # HOLIDAY_COUNTRY: DE                              # public holidays shown by default
      # CORE_URL: http://pocket-core:8080              # Pocket Core: sign-in, the other Pocket apps, Nextcloud, events
      # CORE_REGISTRATION_KEY: …
      # GOOGLE_CLIENT_ID: …             # Google Calendar accounts (see docs/configuration.md)
      # GOOGLE_CLIENT_SECRET: …
      # DEMO_DATA: "true"               # seed a made-up week into an empty box
    volumes:
      - ./data:/data                    # database, secret.key, backups
