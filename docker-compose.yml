services:
  pocket-calendar:
    image: ghcr.io/abjelosevic88/pocket-homelab-calendar:latest
    container_name: pocket-calendar
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-UTC}
      BASE_URL: ${BASE_URL:-}
      # Set both to skip the first-run setup screen and create the admin directly:
      # ADMIN_EMAIL: ${ADMIN_EMAIL}
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # AUTH_MODE: proxy                # trust Remote-User from Authelia / Authentik / Tinyauth
      # NOTIFY_URL: http://apprise:8000/notify/tasks   # reminders and the morning digest
      # CORE_URL: http://pocket-core:8080              # Pocket Core: sign-in, Nextcloud account, events
      # CORE_REGISTRATION_KEY: …
      # DEMO_DATA: "true"               # seed a few made-up tasks into an empty box
    volumes:
      - ./data:/data                    # database, attachments, backups
